services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gophkeeper
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: development-only-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gophkeeper -d gophkeeper"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: .
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOPHKEEPER_ADDRESS: ":8443"
      GOPHKEEPER_DATABASE_DSN: "postgres://gophkeeper:development-only-password@postgres:5432/gophkeeper?sslmode=disable"
      GOPHKEEPER_TLS_CERT: /certs/server.crt
      GOPHKEEPER_TLS_KEY: /certs/server.key
    volumes:
      - ./certs:/certs:ro

volumes:
  postgres-data:
